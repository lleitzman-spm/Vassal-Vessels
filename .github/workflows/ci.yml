name: CI

# Three gates, and the order is deliberate.
#
# leakcheck runs FIRST and runs on every pull request, including from forks. This
# repository was carved out of a private one that held real people's names and live
# credentials; all of that was removed by hand before the first public commit. Hand work
# is a point-in-time guarantee, and a repository open to contributors needs a continuous
# one. A pull request should be told it is carrying a key before a human ever reads it.
#
# It runs before install so it cannot be defeated by a dependency, and so it still
# answers when the tree does not build.
#
# codex runs third: compile the manual, then lint it. `tools/codex/` is pure Node with
# no dependencies (same reasoning as leakcheck), so it needs no install either, and it
# tolerates `data/*.json`, `src/` and `test/` still being built in parallel — see
# `docs/WRIT-THE-CODEX.md`. Its lint is fatal on a dangling wikilink, a quote that does
# not verify against its source, or a table deferred to a reader's plugin; everything
# else is a warning, printed so the debt has a size instead of being invisible.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    name: leakcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` — leakcheck is pure Node with no dependencies, on purpose.
      - run: node tools/leakcheck.mjs

  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: type-check
        run: npm run build
      - name: test
        run: npm test

  codex:
    name: codex (compile + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci` — tools/codex/ is pure Node with no dependencies, on purpose.
      - name: compile
        run: node tools/codex/emit.mjs
      - name: lint
        run: node tools/codex/lint.mjs
